<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABES Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ABES 2nd YEAR</h1>

        <form>

            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="firstname" required>
            </div>

            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lastname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="password" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact" placeholder="Enter your contact number">
            </div>

            <div class="form-group">
                <label>Course</label><br>

                <input type="checkbox" id="bca" name="course" value="BCA">
                <label for="bca">BCA</label><br>

                <input type="checkbox" id="btech" name="course" value="B.Tech">
                <label for="btech">B.Tech</label><br>

                <input type="checkbox" id="bsc" name="course" value="B.Sc">
                <label for="bsc">B.Sc</label>
            </div>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
